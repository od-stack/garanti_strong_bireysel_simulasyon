<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Strong · Bireysel Simülasyon</title>
<style>
:root{--navy:#0A1240;--navy2:#101F6B;--blue:#2557D6;--sky:#9DBBFF;--bg:#F4F6FA;--amber:#F2A33A;--teal:#0F766E;--red:#B42318;--ink:#1F2937;--mut:#5B6577;--line:#DCE2EE}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Arial,Helvetica,sans-serif;color:var(--ink);background:#fff;line-height:1.45;font-size:15px}
h1,h2,h3,.serif{font-family:Cambria,Georgia,"Times New Roman",serif}
button{font:inherit;cursor:pointer}

/* ---------- Kapak ---------- */
.cover{min-height:100vh;background:var(--navy);color:#fff;position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:center;padding:calc(40px + env(safe-area-inset-top)) 28px calc(90px + env(safe-area-inset-bottom))}
.cover::before{content:"";position:absolute;right:-140px;top:-140px;width:520px;height:520px;border-radius:50%;background:var(--navy2)}
.cover .in{position:relative;max-width:760px;margin:0 auto;width:100%}
.cover .eyebrow{color:var(--sky)}
.cover h1{color:#fff;font-size:42px;line-height:1.12;margin:12px 0 14px}
.cover p.lead{color:#D5DEF7;font-size:17px;max-width:620px;margin:0 0 22px}
.cover .row{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:26px}
.cover .tag{background:rgba(255,255,255,.1);border:1px solid rgba(157,187,255,.4);border-radius:999px;padding:6px 14px;font-size:13px}
.cover .tag.m{background:var(--amber);color:var(--navy);border-color:var(--amber);font-weight:700}
.cover .priv{font-size:13px;color:#B9C6EA;max-width:560px;margin:22px 0 0}
.cover .logos{position:absolute;left:28px;right:28px;bottom:calc(22px + env(safe-area-inset-bottom));display:flex;justify-content:space-between;align-items:center}
.cover .logos img{height:30px;width:auto}

/* ---------- Kabuk ---------- */
.shell{max-width:1040px;margin:0 auto;padding:calc(22px + env(safe-area-inset-top)) 20px calc(22px + env(safe-area-inset-bottom))}
.top{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;margin-bottom:6px}
.eyebrow{font-size:11px;letter-spacing:.14em;font-weight:700;color:var(--blue);text-transform:uppercase}
h1.t{color:var(--navy2);font-size:30px;margin:4px 0 4px;line-height:1.15}
.lead{color:var(--mut);margin:0;max-width:640px}
.timer{background:var(--navy2);color:#fff;border-radius:999px;padding:6px 8px 6px 16px;display:flex;align-items:center;gap:8px;white-space:nowrap;flex:none}
.timer .tm{font-variant-numeric:tabular-nums;font-weight:700;font-size:18px;min-width:54px}
.timer .lab{font-size:11px;opacity:.75}
.timer button{border:0;background:rgba(255,255,255,.16);color:inherit;border-radius:999px;width:30px;height:30px;font-size:12px}
.timer.warn{background:var(--amber);color:var(--navy)}
.timer.warn button{background:rgba(10,18,64,.12)}
.timer.over{background:var(--red)}

.stepper{display:flex;flex-wrap:wrap;gap:6px 4px;align-items:center;margin:14px 0 18px}
.st{display:flex;align-items:center;gap:7px;border:0;background:none;padding:3px 10px 3px 3px;border-radius:999px;color:var(--mut);font-size:12px;white-space:nowrap}
.st .dot{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:12px;border:2px solid var(--line);background:#fff;color:var(--mut)}
.st.cur{color:var(--navy2);font-weight:700}
.st.cur .dot{background:var(--blue);border-color:var(--blue);color:#fff}
.st.done .dot{background:var(--navy2);border-color:var(--navy2);color:#fff}
.st.skip .dot{border:2px dashed var(--amber);color:#8a5a00}
.st.bk .dot{background:#FFF1D6;border-color:var(--amber);color:#8a5a00}
.st.bk.cur .dot{background:var(--amber);color:var(--navy)}
.sep{width:12px;height:2px;background:var(--line);flex:none}

.card{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:20px}
.card + .card{margin-top:14px}
.card h3{margin:0 0 4px;color:var(--navy2);font-size:19px}
.card .sub{color:var(--mut);margin:0 0 14px;font-size:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.field{margin-bottom:14px}
.field:last-child{margin-bottom:0}
.field label{display:block;font-weight:700;font-size:13px;color:var(--navy2);margin-bottom:6px}
.field .hint{font-weight:400;color:var(--mut)}
textarea,input[type=text],select{width:100%;font:inherit;color:var(--ink);background:#fff;border:1.5px solid var(--line);border-radius:8px;padding:10px 12px}
textarea{resize:vertical;min-height:70px;overflow:hidden}
textarea:focus,input:focus,select:focus{outline:3px solid rgba(37,87,214,.2);border-color:var(--blue)}
.btn{border:0;border-radius:999px;padding:11px 22px;font-weight:700;font-size:14px}
.btn.primary{background:var(--navy2);color:#fff}
.btn.primary:hover{background:var(--blue)}
.btn.ghost{background:#fff;border:1.5px solid var(--line);color:var(--navy2)}
.btn.amber{background:var(--amber);color:var(--navy)}
.btn.sm{padding:7px 14px;font-size:13px}
.pill{display:inline-block;background:var(--navy2);color:#fff;border-radius:999px;padding:3px 11px;font-size:11px;font-weight:700;letter-spacing:.03em}
.pill.light{background:#E5EBFA;color:var(--navy2)}
.note{border-left:4px solid var(--amber);background:#FFF8EA;border-radius:8px;padding:10px 14px;font-size:13.5px;margin-bottom:14px}
.note.blue{border-left-color:var(--blue);background:#EEF3FF}
.quote{font-family:Cambria,Georgia,serif;font-size:17px;color:var(--navy2);background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 16px;margin-bottom:14px}

.nav{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:18px;flex-wrap:wrap}
.nav .r{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.nav .hintx{font-size:13px;color:var(--mut)}
.foot{display:flex;justify-content:space-between;align-items:center;margin-top:34px;padding-top:14px;border-top:1px solid var(--line)}
.foot img{height:24px;width:auto}

/* ---------- Seviye 1 ---------- */
.addrow{display:grid;grid-template-columns:1fr 170px auto;gap:10px;margin-bottom:12px}
.srow{display:grid;grid-template-columns:1fr 120px 120px auto auto;gap:8px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-bottom:8px}
.srow .nm{font-weight:700;color:var(--navy2);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.srow select{padding:7px 8px;font-size:13px}
.srow .x{border:0;background:none;font-size:18px;color:var(--mut);padding:0 6px}
.chip{display:inline-block;border-radius:999px;padding:4px 11px;font-size:13px;font-weight:700;margin:3px 4px 3px 0;color:#fff}
.chip.dis{background:var(--blue)}
.chip.ic{background:var(--teal)}
.chip.f{box-shadow:0 0 0 3px var(--amber)}
.tp{font-size:11px;font-weight:700;border-radius:999px;padding:2px 9px}
.tp.dis{background:#E3EBFF;color:var(--blue)}
.tp.ic{background:#D9F1EE;color:var(--teal)}
.mx{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
.q{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:96px}
.q h4{margin:0 0 6px;font-size:12px;color:var(--navy2)}
.q h4 span{display:block;font-weight:400;color:var(--mut)}
.q.qa{background:#EAF0FC;border-color:#B9C8EC}
.q.qr{background:#FCEAEA;border-color:#E3AFAF}
.q.qg{background:#F1F9E4;border-color:#C5DDA1}

/* ---------- Seviye 2 ---------- */
.blk{display:flex;align-items:center;gap:10px;margin:0 0 12px}
.blk .n{width:28px;height:28px;border-radius:50%;background:var(--navy2);color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.blk h3{margin:0;flex:1}
.emp{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.emp .box{background:#fff;border:1px solid var(--line);border-top:5px solid var(--navy2);border-radius:10px;padding:12px}
.emp .box.b2{border-top-color:var(--blue)}
.emp .box.b3{border-top-color:var(--teal)}
.emp .box.b4{border-top-color:var(--sky)}
.emp .box.b5{border-top-color:var(--red)}
.emp .box.b6{border-top-color:var(--amber)}
.emp .box label{display:block;font-weight:700;color:var(--navy2);font-size:14px}
.emp .box small{display:block;color:var(--mut);margin:2px 0 8px;font-size:12.5px}
.emp textarea{min-height:64px}

/* ---------- Mola ---------- */
.brk{background:#FFF1D6;border:2px solid var(--amber);border-radius:14px;padding:34px 24px;text-align:center}
.brk .big{font-family:Cambria,Georgia,serif;font-size:64px;font-weight:700;color:var(--navy);font-variant-numeric:tabular-nums;line-height:1}
.brk p{margin:10px 0 0;color:#5a4300}

/* ---------- Seviye 5-6 ---------- */
.idea{display:grid;grid-template-columns:1fr;gap:10px;background:#fff;border:2px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px}
.idea.on{border-color:var(--blue);background:#F5F8FF}
.idea .meta{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center}
.idea .meta label{font-size:13px;display:flex;align-items:center;gap:6px}
.sm5{display:grid;grid-template-columns:44px 1fr;gap:12px;margin-bottom:14px}
.sm5 .L{width:44px;height:44px;border-radius:10px;background:var(--navy2);color:#fff;display:grid;place-items:center;font-family:Cambria,Georgia,serif;font-weight:700;font-size:22px}
.sm5 .L.o{background:var(--sky);color:var(--navy)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chips button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:4px 11px;font-size:12px;color:var(--navy2)}
.chips button:hover{border-color:var(--blue)}
.cb{display:flex;align-items:center;gap:8px;font-size:14px}
.cb input{width:18px;height:18px}

/* ---------- Seviye 7 ---------- */
.sum{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.sum .hd{background:var(--navy2);color:#fff;padding:16px 20px}
.sum .hd .eyebrow{color:var(--sky)}
.sum .hd h2{margin:4px 0 0;font-size:22px}
.sum .bd{padding:6px 20px 18px}
.sum .it{padding:12px 0;border-bottom:1px solid var(--line)}
.sum .it:last-child{border-bottom:0}
.sum .it b{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--blue);margin-bottom:3px}
.sum .it p{margin:0;white-space:pre-wrap}
.sum .it .e{color:var(--mut)}
.sum .smart{display:grid;grid-template-columns:28px 1fr;gap:4px 10px;margin-top:6px}
.sum .smart i{font-style:normal;font-family:Cambria,Georgia,serif;font-weight:700;color:#fff;background:var(--navy2);border-radius:6px;text-align:center;height:22px;line-height:22px;font-size:13px}

.ex ul{margin:6px 0 0;padding-left:18px}
.ex li{margin-bottom:4px}
.ex b{color:var(--navy2)}
details.ref{padding:14px 18px}
details.ref summary{cursor:pointer;font-weight:700;color:var(--navy2);font-family:Cambria,Georgia,serif;font-size:17px}
details.ref summary .hint{font-family:Arial,sans-serif;font-size:12px;font-weight:400;color:var(--mut)}
.refgrid{display:grid;grid-template-columns:44px 1fr 1fr;grid-template-rows:84px 84px auto;gap:8px;margin:12px 0 8px;max-width:560px}
.refgrid .qq{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;justify-content:center}
.refgrid .qq b{color:var(--navy2);font-size:14px}
.refgrid .qq i{color:var(--mut);font-size:12px}
.refgrid .qq.hot{border-color:var(--blue);background:#F5F8FF}
.refgrid .yl{grid-row:1/3;display:flex;align-items:center;justify-content:center;writing-mode:vertical-rl;transform:rotate(180deg);font-size:12px;font-weight:700;color:var(--navy2)}
.refgrid .xl{grid-column:2/4;text-align:center;font-size:12px;font-weight:700;color:var(--navy2)}
.defs{font-size:13.5px;margin:6px 0 0}
.vis{overflow-x:auto}
.vis svg{display:block;min-width:560px;width:100%;height:auto}
.e3b{background:#fff;border:1px solid var(--line);border-top:5px solid var(--navy2);border-radius:10px;padding:12px 14px;margin-bottom:12px}
.e3b.b2{border-top-color:var(--blue)}
.e3b.b6{border-top-color:var(--amber)}
.e3b>label{display:block;font-weight:700;color:var(--navy2);font-size:15px;margin-bottom:8px}
.e3b .field label{font-weight:400;color:var(--ink);font-size:13px}
@media (max-width:760px){
  .cover h1{font-size:32px}
  h1.t{font-size:24px}
  .grid2,.emp,.mx{grid-template-columns:1fr}
  .emp .box.b5{grid-column:auto}
  .addrow{grid-template-columns:1fr}
  .srow{grid-template-columns:1fr 1fr}
  .srow .nm{grid-column:1/-1}
  .top{flex-direction:column}
  .st .lb{display:none}
  .st.cur .lb{display:inline}
  .idea .meta{grid-template-columns:1fr}
}
@media print{
  .no-print{display:none !important}
  body{background:#fff}
  .shell{padding:0;max-width:none}
  .sum{border:0}
  .sum .hd{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
.cd{border:2px solid var(--c);background:var(--bg2);border-radius:16px;padding:18px 20px}
.cd h3{margin:0 0 10px;font-family:Arial,Helvetica,sans-serif;font-size:19px;color:var(--navy2)}
.cd p{margin:0 0 10px}
.cd p.big{font-size:16px}
.cd p.qt{font-style:italic;color:var(--navy2)}
.c-blue{--c:#4A6FA5;--bg2:#EAF1FB}.c-sky{--c:#4A90D9;--bg2:#E6F1FC}.c-gold{--c:#D4A853;--bg2:#FEF9E6}.c-green{--c:#7A9A4A;--bg2:#EEF7EC}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.four{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.lt{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;font-family:Arial,Helvetica,sans-serif;font-weight:700;font-size:28px;margin-bottom:12px;background:var(--c);color:var(--navy2)}
.lt.w{color:#fff}
.lt.sm{width:40px;height:40px;font-size:20px;margin:0}
.hrow{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.hrow h3{margin:0}
.four .cd h3{font-size:17px}
.four .cd p{font-size:14.5px}
.four .cd p.d{font-style:italic;color:var(--mut);font-size:13.5px}
.four ul,.cd ul{margin:0;padding-left:18px}
.four li,.cd li{margin-bottom:9px;font-size:14.5px}
.four li{font-style:italic;color:var(--navy2)}
.cd li.n{font-style:normal;color:var(--ink)}
.six{list-style:none;padding:0 !important;margin:0}
.six li{display:grid;grid-template-columns:34px 1fr;gap:12px;margin-bottom:14px !important;font-style:normal !important;color:var(--ink) !important}
.six .no{width:34px;height:34px;border-radius:50%;background:#4A6FA5;color:#fff;display:grid;place-items:center;font-weight:700;font-size:15px}
.six b{display:block;color:var(--navy2);font-size:15px;line-height:1.3}
.six i{display:block;color:var(--blue);font-size:13.5px;margin-top:2px}
.dk{display:grid;grid-template-columns:1.25fr 1fr;gap:14px}
.sc p{margin:0 0 14px;font-size:16px;line-height:1.55}
.sc .ara{background:#EEF3FF;border-left:4px solid var(--blue);border-radius:8px;padding:12px 16px;color:var(--navy2);font-style:italic}
.sc .ara b{font-style:normal}
.sc .qq{font-size:17px;color:var(--navy);margin-bottom:0}
.mini{background:#fff;border:2px solid var(--navy2);border-radius:12px;padding:20px 24px}
.mini p{margin:0 0 14px;font-size:15.5px;line-height:1.6}
.mini p:last-child{margin-bottom:0}
.fd{margin-top:12px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-size:13.5px}
.fd summary{cursor:pointer;font-weight:700;color:var(--navy2)}
.fd ol{margin:8px 0 0;padding-left:20px}
.stepper{gap:6px 18px}
.grp .gl{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--mut);font-weight:700;margin:0 0 4px 3px}
.grp .gd{display:flex;gap:4px}
.st{padding:0}
.st .dot{width:28px;height:28px}
.pill2{display:inline-block;background:#E5EBFA;color:var(--navy2);border-radius:999px;padding:3px 11px;font-size:11px;font-weight:700;margin-left:8px;vertical-align:middle;font-family:Arial,Helvetica,sans-serif}
@media (max-width:900px){.four{grid-template-columns:1fr 1fr}}
@media (max-width:760px){.two,.dk,.four{grid-template-columns:1fr}}
.stepper{gap:14px 30px}
.sec .sh{font-size:11px;font-weight:700;color:var(--navy2);letter-spacing:.1em;text-transform:uppercase;border-bottom:2px solid var(--blue);padding-bottom:3px;margin-bottom:8px}
.sec .subs{display:flex;gap:18px}
.cv{display:grid;grid-template-columns:1fr 1fr;gap:18px 32px;margin:0 0 28px;max-width:720px}
.cvh{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#fff;border-bottom:2px solid var(--sky);padding-bottom:5px;margin-bottom:10px}
.cvg{margin-bottom:10px}
.cvl{font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--sky);margin-bottom:2px}
.cvt{font-size:14.5px;color:#E3EAFB}
@media (max-width:760px){.cv{grid-template-columns:1fr}}
.sec .sh{font-size:11px;font-weight:700;color:var(--navy2);letter-spacing:.1em;text-transform:uppercase;border-bottom:2px solid var(--blue);padding-bottom:3px;margin-bottom:8px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:14px}
.tab{border:1.5px solid var(--line);background:#fff;color:var(--navy2);border-radius:999px;padding:7px 14px;font-size:13px;font-weight:700;white-space:nowrap}
.tab.on{background:var(--navy2);color:#fff;border-color:var(--navy2)}
.seven{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.q7{display:grid;grid-template-columns:44px 1fr;gap:12px;align-items:start;background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px}
.n7{width:44px;height:44px;border-radius:50%;background:#8CC4FF;color:var(--navy);display:grid;place-items:center;font-weight:700;font-size:18px}
.q7 b{display:block;color:var(--navy2);font-size:15px}
.q7 i{display:block;color:var(--blue);margin-top:3px;font-size:14px}
.vkgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;align-items:start}
.vk{background:var(--bg);border:2px solid var(--line);border-radius:14px;padding:16px}
.vk.on{border-color:var(--blue);background:#F5F8FF}
.vkh{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.vkh h3{margin:0;color:var(--navy2);font-size:18px}
.vk p{margin:0 0 10px;font-size:14.5px}
.vk details{margin:0 0 12px;font-size:14.5px}
.vk summary{cursor:pointer;font-weight:700;color:var(--blue);margin-bottom:8px}
.fd+.fd{margin-top:8px}
.nrow{display:grid;grid-template-columns:24px 1fr;gap:6px;align-items:center;margin-bottom:8px}
.nrow span{color:var(--mut);font-weight:700}
.pbox{margin-bottom:14px}
.pbox>label{display:block;font-weight:700;font-size:13px;color:var(--navy2);margin-bottom:8px}
.cvr{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px solid rgba(157,187,255,.2);font-size:14.5px;color:#E3EAFB}
.cvr span:last-child{color:var(--sky);font-weight:700;white-space:nowrap}
.cv{margin-bottom:28px}
@media (max-width:900px){.vkgrid{grid-template-columns:1fr}}
@media print{.tabs,.fd.no-print{display:none !important}}
</style>
</head>

<div id="app"></div>
<script>const CASES = [{"title": "Mini Senaryo – A", "paras": ["Ekibinize başka bir şubeden yeni atanmış olan bir elemanınız var. İşin teknik boyutuna hakim olup uzun yıllardır GarantiBBVA’da çalışmış olmasından dolayı kurumsal hafızaya da sahip. Çevresinde sevilen biri.", "Siz özellikle son dönemlerde artan belirsizlikten sebep daha da artan zaman ve pusula baskısı altında olduğunuzdan ve işlere kısa sürede çözüm üretilmesini istediğinizden, kendisine yönlendirme yapmadan devam etme ihtiyacı içerisindesiniz.", "Gözlemlerinize göre, zaman zaman geçmiş yaşanmışlıklar ve konfor alanından çıkmakta güçlük çekmesi konuları çözüme ulaştırmakta zorlanmasına neden olmaktadır. Bu durum son dönemde çalışma ortamının daha da dijital ağırlıklı yürümesinden dolayı artmış durumda. Kendisini yeterince geliştirmeye gayret etmediğini de görmektesiniz. Kendisi ile bir geri bildirim toplantısı yapıp, özellikle kendi yetki ve sorumluluk alanında olan tüm işler için inisiyatif kullanması gerektiği konusunda da kendisine yönlendirme yapmayı planlıyorsunuz. Amacınız bazı konularda kendisini geliştirmeye odaklandığında deneyim ve yetkinliklerini daha rahat davranış boyutuna aktarabileceğinin farkındalığını sağlamak. Koçluk yaklaşımı ile çalışanınızı destekleyin."]}, {"title": "Mini Senaryo – B", "paras": ["Z jenerasyonundan bir çalışanınız var. Daha yolun başında, genç ve iş hayatına gireli yaklaşık iki sene olmuş. Daha önce farklı bir sektör tecrübesinden sonra bankacılığa geçiş yapmış ve 7 aydır sizinle çalışıyor. Daha önce bir startup da çalışmış olduğundan kurumsal yapıya geçiş yapmakta zorlanıyor. Sürekli sistemi sorguluyor, raporlamaları gereksiz buluyor üstelik mail yazarken kullandığı yazılı iletişim dilinden de rahatsızsınız. Fazla informal olduğunu düşünüyorsunuz.", "Vermiş olduğunuz görevleri yerine getirirken etkin sonuç alamıyor. 7 aylık bir süre içerisinde bilgisinin bir türlü istediğiniz seviyeye gelmediğini görüyorsunuz. Yapamadığını söylediği işleri rol model olmak adına defalarca yaparak sonuç aldınız. Bir dahaki sefere benden gördüklerini uygulayarak başarılı olacaktır diye düşünmenize rağmen hayal kırıklığı yaşadınız.", "Zamanını iyi yönetemiyor. İş-yaşam dengesine oldukça önem veriyor. Üstelik işlerini bitirmeden mesai bitiminde çıkması sizi rahatsız ediyor. Daha fazla sorumlu tutum tavır sergilemesini istiyorsunuz.", "İş çıktısı ve kalitesi ile ilgili bir geri bildirim seansı yapmayı planlıyorsunuz. Daha etkin planlama yapması ve önceliklerini belirlemesi daha fazla sorumluluk alması konularında farkındalığını artırmak ve geliştirmek istiyorsunuz. Amacınız bunca ay emek verdiğiniz çalışanınızı kazanmak verimliliğini arttırmak. Koçluk yaklaşımı ile çalışanınızı geliştirin."]}, {"title": "Mini Senaryo – C", "paras": ["İletişim etkinliğini sağlamakta zorluk çeken bir elemanınız var. Özellikle diğer birimlerle etkileşim açısından zorluk çekiyor. Kendisi genç olduğundan, özellikle deneyimli elemanlarla arasında gerginlik yaşandığına ve negatif enerjinin ortama yayıldığına şahit oluyorsunuz. Zaman zaman karşındakini dinlemeden daha da didaktik tavırlar sergilediğini gözlemliyorsunuz", "Gözlemlerinize göre sorun kendini arkadaşlarının yerine koyamamasından kaynaklanıyor. Bir başka deyişle empati gösterebilme konusunda oldukça başarısız… Ayrıca, algılama farkları olabileceğini hiç düşünmeden kendi algılama biçimini sanki tek doğruymuşcasına karşısındakine dikte etme eğilimi de var.", "Diğer birimler de bu durumun farkında olduklarından, kendisine cephe almak üzereler. Bu gelişmeler, takım etkinliğini ve işbirliğini kısa bir zaman içerisinde olumsuz etkileyecekmiş gibi görünüyor.  Kendisiyle bir geri bildirim toplantısı yapmak istiyorsunuz.", "Bu toplantıda genel olarak işlerin nasıl gittiğini görüştükten sonra, empati ve algılama konusunda kendisine yönlendirme yapmayı planlıyorsunuz. Ayrıca diğer birimlerle yaşanan iletişim sorunlarının takım performansını genelde nasıl olumsuz etkilediği konusunda da farkındalığını yükseltmeyi hedefliyorsunuz. Koçluk yaklaşımı kullanın."]}];

const SECS = ["Simülasyon","Gelişim"];
const IDX = Object.fromEntries(STEPS.map((s,i)=>[s.id,i]));

function fresh(){return {cur:0,last:1,seen:{},timers:{},caseSel:-1,prep:"",fb:"",topics:"",disc:"",
  plan:{name:"",g1:"",g2:"",why1:"",why2:"",a1:"",a2:"",a3:"",a4:"",a5:"",who:"",kpi:""}}}
function load(){try{const r=localStorage.getItem(KEY);if(!r)return null;const o=JSON.parse(r);const f=fresh();o.plan=Object.assign(f.plan,o.plan||{});return Object.assign(f,o)}catch(e){return null}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
let S = load() || fresh();
let running=false, tick=0, tab="geri";

const esc = s => String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const $ = s => document.querySelector(s);
const getp = p => p.split(".").reduce((o,k)=>o==null?o:o[k],S);
function setp(p,v){const ks=p.split(".");const last=ks.pop();ks.reduce((o,k)=>o[k],S)[last]=v}
function grow(el){if(el.tagName==="TEXTAREA"){el.style.height="auto";el.style.height=Math.max(el.scrollHeight+2,el.dataset.min?+el.dataset.min:90)+"px"}}
function wire(root){
  root.querySelectorAll("[data-bind]").forEach(el=>{
    const p=el.dataset.bind; el.value=getp(p)==null?"":getp(p);
    el.addEventListener("input",()=>{setp(p,el.value);save();grow(el)});
    grow(el);
  });
}

/* ---------- Süre ---------- */
const stepNow = () => STEPS[S.cur];
function rem(){const st=stepNow();if(!st.min)return 0;if(S.timers[st.id]==null)S.timers[st.id]=st.min*60;return S.timers[st.id]}
const fmt = s => String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0");
function paintTimer(){
  const el=$("#timer"); if(!el) return;
  const r=rem();
  el.classList.toggle("warn", r>0 && r<=60);
  el.classList.toggle("over", r===0);
  $("#tm").textContent = r===0 ? "Süre doldu" : fmt(r);
  $("#tgl").textContent = running ? "❚❚" : "▶";
}
setInterval(()=>{
  if(!running) return;
  const st=stepNow(); if(!st.min) return;
  if(rem()>0) S.timers[st.id]--;
  if(rem()<=0) running=false;
  tick++; if(tick%5===0) save();
  paintTimer();
},1000);
function toggleTimer(){if(rem()>0){running=!running} paintTimer()}
function resetTimer(){running=false;S.timers[stepNow().id]=stepNow().min*60;save();paintTimer()}

/* ---------- Gezinme ---------- */
function go(i){
  running=false;
  const prev=STEPS[S.cur]; if(prev&&prev.id!=="intro") S.seen[prev.id]=1;
  S.cur=Math.max(0,Math.min(STEPS.length-1,i)); if(S.cur>0) S.last=S.cur; save(); render(); window.scrollTo({top:0});
}
function stepperHTML(){
  return SECS.map((sl,si)=>{
    const dots=STEPS.map((s,i)=>({s,i})).filter(o=>o.s.sec===si).map(({s,i})=>{
      const done=S.seen[s.id]&&i!==S.cur;
      return `<button class="st ${i===S.cur?"cur":""} ${done?"done":""}" data-go="${i}" title="${esc(s.title)}"><span class="dot">${done?"✓":i}</span></button>`;
    }).join("");
    return `<div class="sec"><div class="sh">${sl}</div><div class="gd" style="display:flex;gap:4px">${dots}</div></div>`;
  }).join("");
}
function timerHTML(){
  return `<div class="timer no-print" id="timer"><span class="lab">Süre</span><span class="tm" id="tm">${fmt(rem())}</span>
  <button id="tgl" title="Başlat / duraklat">▶</button><button id="rst" title="Sıfırla">↺</button></div>`;
}
const LOGOS = `<div class="foot no-print"><img src="${LOGO_G}" alt="Garanti BBVA"><img src="${LOGO_M}" alt="MCT Management Centre Türkiye"></div>`;

/* ---------- Hatırlatma içerikleri (sunumdan) ---------- */
const GROW = [
  ["G","Hedef","Ne başarmak istiyorsun?","Hedefin netleştirilmesi, ölçülebilir ve ulaşılabilir hale getirilmesi.",["Ne elde etmek istiyorsun?","Hedefine ulaşmanın yaratacağı en büyük etki ne olurdu?","Bunu başarmak sana ne hissettirirdi?","Bu konuşmadan ne elde etmek istersin?","Sonunda neyin farklı olmasını istersin?"],"c-blue"],
  ["R","Gerçeklik","Şu anda neredesin?","Mevcut koşulların, güçlü yönlerin, engellerin ve kaynakların değerlendirilmesi.",["Neyi iyi yapıyorsun? Neyi daha iyi yapabilirsin?","Bu durum sana ne kazandırıyor?","Şu an gerçekte ne oluyor?","Asıl zorluk ne? Ve başka?","Seni engelleyen faktörler neler?"],"c-sky"],
  ["O","Seçenekler","Neler yapabilirsin?","Alternatif yolların, çözüm önerilerinin ve fırsatların keşfedilmesi.",["Her şey mümkün olsaydı ne yapardın?","Hedeflediğin noktaya ulaşmış biri ne yapardı?","Bunu en baştan bilseydin ne yapardın?","Başka hangi yolları deneyebilirsin?","En iyi alternatif hangisi?"],"c-gold"],
  ["W","Aksiyon","Ne yapacaksın?","Somut aksiyonların, sorumlulukların ve zaman planının belirlenmesi.",["İhtiyacın olan bilgiye nasıl ulaşabilirsin?","İlk adımın ne olacak?","Ne zaman yapacaksın?","Bunu yaptığını nasıl anlayacaksın?"],"c-green"]
];
const SEVEN = [
  ["Başlangıç Sorusu","Aklında ne var?"],["“And What Else” Sorusu","Ve başka...?"],["Odak Sorusu","Senin için buradaki asıl zorluk ne?"],
  ["Temel Soru","Ne istiyorsun?"],["Strateji Sorusu","Eğer buna 'evet' diyorsan, neye 'hayır' diyorsun?"],["Tembel Soru","Sana nasıl yardımcı olabilirim?"],["Öğrenme Sorusu","Senin için en yararlı olan neydi?"]
];
const TABS = [["geri","Geri bildirim"],["feed","FEED"],["dikkat","Dikkat!"],["grow","GROW"],["growq","GROW soruları"],["yedi","7 Altın Soru"],["etkili","Etkili soru"]];
const panels = {};
panels.geri = () => `<div class="two">
    <div class="cd c-blue"><h3>Geri bildirim</h3><p class="big">Geçmişe bakar: ne oldu, etkisi ne oldu?</p>
      <p class="qt">“Dünkü sunumda müşteri sorularını yöneltirken iki kez sözünü keserek cevaplandırmaya başladın, sorusunu tamamlayamadı.”</p></div>
    <div class="cd c-green"><h3>İleri besleme</h3><p class="big">Geleceğe bakar: bir dahaki sefere ne deneyebilirsin?</p>
      <p class="qt">“Bir sonraki sunumda soruları not alıp sonra cevaplamayı dener misin?”</p></div></div>`;
panels.feed = () => {
  const c=(cls,l,w,t,d)=>`<div class="cd ${cls}"><div class="lt ${w?"w":""}">${l}</div><h3>${t}</h3><p>${d}</p></div>`;
  return `<div class="four">
    ${c("c-blue","F",1,"Gözlem (Fact)","Yorum, yargı ve suçlama katmadan, kamera veya ses kaydı gibi olduğu gibi aktarın.")}
    ${c("c-sky","E",0,"Etki (Effect)","Varsaymadan, davranışın takıma, sürece ve kişiye etkisini anlatın.")}
    ${c("c-gold","E",0,"Beklenti (Expectation)","Beklediğiniz yeni davranışı ve ihtiyacınızı söyleyin.")}
    ${c("c-green","D",0,"Diyalog (Dialogue)","Net, somut, yapılabilir, olumlu bir rica ve karşılıklı konuşma.")}</div>`;
};
panels.dikkat = () => {
  const E=[["Geri bildirimin davranışı değil, bireyi yargılaması","İstekli birisin"],["Geri bildirimde belirsizlik","Hiçbir şeyi zamanında teslim etmiyorsun"],["Geri bildirimin bir başkası üzerinden verilmesi","Semih yeni görevin konusunda sıkıntılı olduğunu söyledi"],["Geri bildirimde yersiz mizah veya iğneleyici bir dil kullanılması","Zamanında geldin... Ne kadar güzel bir değişiklik"],["Geri bildirimin bir ifade değil, bir soru biçiminde olması","Bu sunumda başarılı olmak istiyor musun?"],["Geri bildirim davranışın ardında yatan nedeni hakkında varsayım içermesi","Plan yapmayı sevmediğin için etkin değilsin"]];
  const N=["Elinizde tam bilgi yoksa","Alıcının kontrol edemeyeceği bir şeyi ilgilendiriyorsa","Kişi fazlasıyla duygusal veya kırılgan ise","Ayrıntılı açıklama yapacak vaktiniz yoksa","Geri bildiriminiz daha verimli bir davranış ihtiyacı değil, kişisel bir tercihi temel alıyorsa","Kişinin nasıl ilerleyebileceğine dair bir çözüm sunamıyorsanız"];
  return `<div class="dk">
    <div class="cd c-blue"><h3>Geri bildirimde sık yapılan 6 hata</h3><ul class="six">${E.map((e,i)=>`<li><span class="no">${i+1}</span><span><b>${e[0]}</b><i>“${e[1]}”</i></span></li>`).join("")}</ul></div>
    <div class="cd c-gold"><h3>Ne zaman geri bildirim vermemeli?</h3><ul>${N.map(n=>`<li class="n">${n}</li>`).join("")}</ul></div></div>`;
};
panels.grow = () => `<div class="four">${GROW.map(g=>`<div class="cd ${g[5]}"><div class="hrow"><div class="lt sm ${g[0]==="G"?"w":""}">${g[0]}</div><h3>${g[1]}</h3></div><p>${g[2]}</p><p class="d">${g[3]}</p></div>`).join("")}</div>`;
panels.growq = () => `<div class="four">${GROW.map(g=>`<div class="cd ${g[5]}"><div class="hrow"><div class="lt sm ${g[0]==="G"?"w":""}">${g[0]}</div><h3>${g[1]}</h3></div><ul>${g[4].map(x=>`<li>${x}</li>`).join("")}</ul></div>`).join("")}</div>`;
panels.yedi = () => `<div class="seven">${SEVEN.map((q,i)=>`<div class="q7"><div class="n7">${i+1}</div><div><b>${q[0]}</b><i>“${q[1]}”</i></div></div>`).join("")}</div>`;
panels.etkili = () => {
  const L=[["1 · Açık uçlu","Evet ya da hayırla bitmeyen."],["2 · Yönlendirmeyen","Cevabı içinde taşımayan."],["3 · Yargılamayan","Suçlama ya da eleştiri taşımayan."],["4 · Kısa ve net","Tek fikirli, uzun olmayan."],["5 · Soruyu soruyla açıklamayın","Sorduktan sonra susun, cevabı bekleyin."]];
  return `<div class="cd c-sky"><h3>Etkili soru sorma: sorular nasıl olmalı?</h3>
    <ul class="six" style="margin-bottom:12px">${L.map(l=>`<li style="grid-template-columns:1fr"><span><b>${l[0]}</b><span style="color:var(--mut);font-size:14px">${l[1]}</span></span></li>`).join("")}</ul>
    <p style="margin:0"><b>“Ne” ve “Nasıl” ile başlayan sorular güvenli bir başlangıçtır. “Neden” sorusuna dikkat.</b></p></div>`;
};

/* Rol hazırlığı sırasında açılır hatırlatmalar */
const REMIND = `
  <details class="fd"><summary>GROW modelini hatırla</summary>
    <ol style="list-style:none;padding-left:0">${GROW.map(g=>`<li style="margin-bottom:12px"><b>${g[0]} · ${g[1]}:</b> ${g[2]}<br><span style="color:var(--mut)">${g[3]}</span><br><span style="color:var(--navy2);font-style:italic">${g[4].join(" · ")}</span></li>`).join("")}</ol></details>
  <details class="fd"><summary>7 Altın Soru</summary>
    <ol style="padding-left:20px">${SEVEN.map(q=>`<li style="margin-bottom:6px"><b>${q[0]}:</b> <i>“${q[1]}”</i></li>`).join("")}</ol></details>`;

/* ---------- Ekranlar ---------- */
const screens = {};
screens.oku = () => `
  <div class="tabs no-print">${TABS.map(t=>`<button class="tab ${tab===t[0]?"on":""}" data-tab="${t[0]}">${t[1]}</button>`).join("")}</div>
  <div id="panel">${panels[tab]()}</div>`;

function caseCard(i){return `<div class="mini">${CASES[i].paras.map(p=>`<p>${esc(p)}</p>`).join("")}</div>`}
screens.vaka = () => `
  <div class="vkgrid">${CASES.map((c,i)=>`
    <div class="vk ${S.caseSel===i?"on":""}">
      <div class="vkh"><h3>${esc(c.title)}</h3>${S.caseSel===i?'<span class="pill">Seçildi</span>':""}</div>
      <p>${esc(c.paras[0])}</p>
      <details><summary>Devamını oku</summary>${c.paras.slice(1).map(p=>`<p>${esc(p)}</p>`).join("")}</details>
      <button class="btn sm ${S.caseSel===i?"primary":"ghost"}" data-case="${i}">${S.caseSel===i?"✓ Seçildi":"Bu vakayı seç"}</button>
    </div>`).join("")}</div>`;

function needCase(){return `<div class="note">Önce <b>Vaka seç</b> adımından bir vaka seç. <button class="btn ghost sm" data-go="${IDX.vaka}">Vaka seç</button></div>`}
screens.hazir = () => S.caseSel<0 ? needCase() : `
  <div class="eyebrow" style="margin-bottom:6px">Seçtiğin vaka: ${esc(CASES[S.caseSel].title)}</div>
  ${caseCard(S.caseSel)}
  <div class="card" style="margin-top:14px">
    <div class="field"><label for="prep">Hazırlık notların</label><textarea id="prep" data-bind="prep" data-min="140" placeholder="Görüşmeye nasıl başlayacaksın, hangi soruları soracaksın?"></textarea></div>
    ${REMIND}
  </div>`;

screens.rol = () => S.caseSel<0 ? needCase() : `
  <div class="eyebrow" style="margin-bottom:6px">Vaka: ${esc(CASES[S.caseSel].title)}</div>
  <details class="fd" open style="margin-top:0"><summary>Vakayı göster / gizle</summary><div style="margin-top:10px">${caseCard(S.caseSel)}</div></details>
  ${S.prep.trim()?`<details class="fd"><summary>Hazırlık notlarım</summary><p style="white-space:pre-wrap;margin:8px 0 0">${esc(S.prep)}</p></details>`:""}
  ${REMIND}`;

screens.fb = () => `
  <div class="card"><div class="field"><label for="fb">Danışmandan aldığım geri bildirim</label>
    <textarea id="fb" data-bind="fb" data-min="180"></textarea></div></div>`;

screens.konu = () => `
  <div class="quote">Güncel konularınız: gündeminizde olan, desteklenmek istediğiniz koçluk konularınız.</div>
  <div class="card"><div class="field"><label for="konu">Konularım</label>
    <textarea id="konu" data-bind="topics" data-min="180" placeholder="Her satıra bir konu yazabilirsin"></textarea></div></div>`;

screens.tart = () => `
  ${S.topics.trim()?`<div class="card"><div class="eyebrow" style="margin-bottom:6px">Güncel konularım</div><p style="white-space:pre-wrap;margin:0">${esc(S.topics)}</p></div>`:`<div class="note">Güncel konularını henüz yazmadın. <button class="btn ghost sm" data-go="${IDX.konu}">Konularıma git</button></div>`}
  <div class="card" style="margin-top:14px"><div class="field"><label for="disc">Tartışmadan aldıklarım</label>
    <textarea id="disc" data-bind="disc" data-min="160"></textarea></div></div>`;

function planText(){
  const p=S.plan, t=x=>x&&x.trim()?x.trim():"—";
  return "GELİŞİM HEDEFİ BELİRLEME ÇALIŞMASI\nİsim - Soyisim: "+t(p.name)+
   "\n\nGELİŞİM HEDEFİM 1\n"+t(p.g1)+"\n\nGELİŞİM HEDEFİM 2\n"+t(p.g2)+
   "\n\nA. NEDEN BU GELİŞİM HEDEFLERİNİ SEÇTİM?\n1- "+t(p.why1)+"\n2- "+t(p.why2)+
   "\n\nB. GELİŞİM İÇİN AKSİYONLARIM %70, %20, %10\n1- "+t(p.a1)+"\n2- "+t(p.a2)+"\n3- "+t(p.a3)+"\n4- "+t(p.a4)+"\n5- "+t(p.a5)+
   "\n\nC. KİMLERİN DESTEĞİNİ ALMAM GEREKİYOR?\n"+t(p.who)+"\n\nD. GELİŞTİĞİMDE GÖZÜMDE CANLANDIRDIĞIM SONUÇ (KPI)\n"+t(p.kpi);
}
screens.plan = () => {
  const recap=[["Güncel konularım",S.topics],["Danışman geri bildirimi",S.fb],["Tartışmadan aldıklarım",S.disc]].filter(r=>r[1]&&r[1].trim());
  const inp=(k,ph)=>`<input type="text" data-bind="plan.${k}" placeholder="${ph||""}">`;
  const num=(pre,keys)=>keys.map((k,i)=>`<div class="nrow"><span>${i+1}-</span>${inp(k)}</div>`).join("");
  return `
  ${recap.length?`<details class="fd no-print" style="margin-top:0"><summary>Önceki notlarım</summary>${recap.map(r=>`<div style="margin-top:10px"><div class="eyebrow">${r[0]}</div><p style="white-space:pre-wrap;margin:2px 0 0">${esc(r[1])}</p></div>`).join("")}</details>`:""}
  <div class="card" style="margin-top:14px">
    <div class="field"><label for="pn">İsim – Soyisim</label><input type="text" id="pn" data-bind="plan.name"></div>
    <div class="grid2">
      <div class="field"><label for="pg1">Gelişim hedefim 1</label><textarea id="pg1" data-bind="plan.g1" data-min="80"></textarea></div>
      <div class="field"><label for="pg2">Gelişim hedefim 2</label><textarea id="pg2" data-bind="plan.g2" data-min="80"></textarea></div>
      <div class="pbox"><label>A. Neden bu gelişim hedeflerini seçtim?</label>${num("why",["why1","why2"])}</div>
      <div class="pbox"><label>B. Gelişim için aksiyonlarım %70, %20, %10</label>${num("a",["a1","a2","a3","a4","a5"])}</div>
      <div class="field"><label for="pw">C. Kimlerin desteğini almam gerekiyor?</label><textarea id="pw" data-bind="plan.who" data-min="100"></textarea></div>
      <div class="field"><label for="pk">D. Geliştiğimde gözümde canlandırdığım sonuç (KPI)</label><textarea id="pk" data-bind="plan.kpi" data-min="100"></textarea></div>
    </div>
  </div>
  <div class="nav no-print" style="justify-content:flex-start;margin-top:16px">
    <button class="btn primary" id="cp">Planımı kopyala</button>
    <button class="btn ghost" id="pr">Yazdır / PDF kaydet</button>
    <span class="hintx" id="msg"></span>
  </div>`;
};

function coverHTML(){
  const started = S.cur>0 || Object.keys(S.seen).length>0;
  const row=(a,b)=>`<div class="cvr"><span>${a}</span><span>${b}</span></div>`;
  return `<section class="cover"><div class="in">
    <div class="eyebrow">Strong Gelişim Programı</div>
    <h1>Bireysel Simülasyon</h1>
    <p class="lead">Yönetici rolüne hazırlan, vakayı koçluk yaklaşımıyla oyna, danışmandan geri bildirim al ve gelişim planını yaz. Toplam 60 dakika.</p>
    <div class="cv">
      <div class="cvs"><div class="cvh">Simülasyon</div>
        ${row("Hatırlayalım · özetlere göz at","")}
        ${row("Vaka seç · 3 vakadan biri","")}
        ${row("Yönetici rolüne hazırlık","10 dk")}
        ${row("Rol oyunu","15 dk")}
        ${row("Danışman geri bildirimi","5 dk")}</div>
      <div class="cvs"><div class="cvh">Gelişim</div>
        ${row("Güncel konularım · zihinsel hazırlık","5 dk")}
        ${row("Üzerine tartışma","10 dk")}
        ${row("Gelişim planı","15 dk")}</div>
    </div>
    <button class="btn primary" style="background:var(--blue);padding:13px 30px;font-size:15px" data-go="1">Başla →</button>
    ${started?`<button class="btn ghost" style="margin-left:10px;background:transparent;color:#fff;border-color:rgba(255,255,255,.4)" data-go="${S.last||1}">Kaldığım yerden devam et</button>`:""}
    <p class="priv">Yazdıkların bu cihazda saklanır, başka kimseye gönderilmez.</p>
  </div>
  <div class="logos"><img src="${LOGO_GW}" alt="Garanti BBVA"><img src="${LOGO_MW}" alt="MCT Management Centre Türkiye"></div></section>`;
}

function render(){
  const app=$("#app"), st=stepNow();
  if(st.id==="intro"){app.innerHTML=coverHTML();bind(app);return}
  const last=S.cur===STEPS.length-1;
  app.innerHTML=`<div class="shell">
    <div class="top"><div><div class="eyebrow">${esc(st.eb)}</div><h1 class="t">${esc(st.title)}</h1><p class="lead">${esc(st.lead)}</p></div>${st.min?timerHTML():""}</div>
    <div class="stepper no-print">${stepperHTML()}</div>
    <div id="body">${screens[st.id]()}</div>
    <div class="nav no-print">
      <button class="btn ghost" data-go="${S.cur-1}">← Geri</button>
      <div class="r">${last?`<button class="btn ghost" data-go="0">Başa dön</button>`:`<button class="btn primary" data-go="${S.cur+1}">Devam →</button>`}</div>
    </div>
    ${LOGOS}
  </div>`;
  const body=$("#body"); wire(body); bind(app);
  if(st.min){$("#tgl").onclick=toggleTimer;$("#rst").onclick=resetTimer;paintTimer()}
  if(st.id==="oku"){
    body.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});
  }
  if(st.id==="vaka"){
    body.querySelectorAll("[data-case]").forEach(b=>b.onclick=()=>{S.caseSel=+b.dataset.case;save();render()});
  }
  if(st.id==="plan"){
    $("#cp").onclick=async()=>{
      const t=planText();let ok=false;
      try{await navigator.clipboard.writeText(t);ok=true}catch(e){}
      if(!ok){const ta=document.createElement("textarea");ta.value=t;document.body.appendChild(ta);ta.select();try{ok=document.execCommand("copy")}catch(e){}ta.remove()}
      $("#msg").textContent=ok?"Kopyalandı ✓":"Kopyalanamadı, metni elle seçip kopyala.";
    };
    $("#pr").onclick=()=>window.print();
  }
}
function bind(root){root.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>go(+b.dataset.go))}
render();
</script>
</body>
</html>
